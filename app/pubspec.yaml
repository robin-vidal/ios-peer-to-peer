name: p2pchat
description: "Peer to peer chat between two iOS devices, keys held in the Secure Enclave."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  registry_client:
    path: ../client
  qr_flutter: ^4.0.0
  mobile_scanner: ^7.5.0
  sliding_up_panel: ^2.0.0+1
  sqflite: ^2.4.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/camera_icon.png

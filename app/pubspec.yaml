name: p2pchat
description: "Peer to peer chat between two iOS devices, keys held in the Secure Enclave."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  registry_client:
    path: ../client
  flutter_svg: ^2.5.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/server.svg
    - assets/icons/logo.png

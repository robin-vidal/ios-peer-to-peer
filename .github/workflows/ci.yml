name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: registry-server/go.mod
          cache: false
      - name: Vet
        working-directory: registry-server
        run: go vet ./...
      - name: Test
        working-directory: registry-server
        run: go test ./...

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b
        with:
          sdk: 3.14.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: registry-server/go.mod
          cache: false
      - name: Report the toolchain the integration test needs
        run: |
          go version
          openssl version
      - name: Get
        working-directory: client
        run: dart pub get
      - name: Analyze
        working-directory: client
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: client
        run: dart test --reporter github --file-reporter json:test-report.json
      - name: Refuse a skipped test
        run: .github/scripts/refuse-skipped-tests.sh client/test-report.json

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.50.0
      - name: Get
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test --reporter github --file-reporter json:test-report.json
      - name: Refuse a skipped test
        run: .github/scripts/refuse-skipped-tests.sh app/test-report.json
